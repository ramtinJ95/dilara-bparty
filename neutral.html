<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Välkommen</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #222; background: #f6f6f4; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
      form { display: grid; gap: 12px; width: min(320px, 100vw - 48px); }
      label { font-size: 15px; color: #555; }
      input, button { font: inherit; font-size: 18px; padding: 14px 16px; border-radius: 10px; border: 1px solid #ccc; }
      input { text-transform: uppercase; letter-spacing: 0.12em; background: #fff; }
      button { background: #333; color: #fff; border-color: #333; }
      button:disabled { opacity: 0.6; }
      p { margin: 0; color: #a33; min-height: 1.4em; }
    </style>
    <script type="module" src="/src/client/neutral/main.ts"></script>
  </head>
  <body>
    <form id="code-form" novalidate>
      <label for="code">Kod</label>
      <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" />
      <button type="submit">Fortsätt</button>
      <p id="error" role="alert"></p>
    </form>
  </body>
</html>
